name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version: '1.26.0'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.10.1

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: [lint]
    if: ${{ always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version: '1.26.0'
          cache: true

      - name: Start Keycloak
        run: |
          docker compose -f test/oauth2/compose.yaml up -d --build
          # Wait for Keycloak to become healthy (up to 3 minutes)
          for i in {1..36}; do
            if curl -sf http://localhost:9000/health | jq -e '.status == "UP"' > /dev/null 2>&1; then
              echo "Keycloak is healthy"
              break
            fi
            echo "Waiting for Keycloak... ($i/36)"
            sleep 5
          done

      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.txt ./...

      - name: Stop Keycloak
        if: always()
        run: docker compose -f test/oauth2/compose.yaml down -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          fail_ci_if_error: false

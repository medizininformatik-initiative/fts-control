name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26.3'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.12.2

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: [lint]
    if: ${{ always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26.3'
          cache: true

      - name: Start Keycloak
        run: |
          docker compose -f test/oauth2/compose.yaml up -d --build
          # Wait for Keycloak to become healthy (up to 3 minutes)
          for i in {1..36}; do
            if curl -sf http://localhost:9000/health | jq -e '.status == "UP"' > /dev/null 2>&1; then
              echo "Keycloak is healthy"
              break
            fi
            echo "Waiting for Keycloak... ($i/36)"
            sleep 5
          done

      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.txt ./...

      - name: Stop Keycloak
        if: always()
        run: docker compose -f test/oauth2/compose.yaml down -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          fail_ci_if_error: false

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1

  vuln:
    name: Vulnerability Scanning
    uses: ./.github/workflows/_vuln.yaml

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: [lint]
    if: ${{ always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Start Keycloak
        run: |
          docker compose -f test/oauth2/compose.yaml up -d --build
          # Wait for Keycloak to become healthy (up to 3 minutes)
          for i in {1..36}; do
            if curl -sf http://localhost:9000/health | jq -e '.status == "UP"' > /dev/null 2>&1; then
              echo "Keycloak is healthy"
              break
            fi
            echo "Waiting for Keycloak... ($i/36)"
            sleep 5
          done

      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.txt ./...

      - name: Stop Keycloak
        if: always()
        run: docker compose -f test/oauth2/compose.yaml down -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          fail_ci_if_error: false
